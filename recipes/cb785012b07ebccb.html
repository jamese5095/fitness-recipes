<article><header class="recipe-heading"><h1>黑椒蘑菇牛肉饭</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>牛肉 <strong>200 g</strong>（菲力、吊龙、匙柄或匙仁；按可食生重）</li>
<li>生米 <strong>80 g</strong>、蘑菇约 <strong>150 g</strong></li>
<li>黑胡椒、蒜末、少量生抽；食用油喷雾按需使用</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>米饭提前煮好。牛肉逆纹切薄片，用黑胡椒和少量生抽抓匀；蘑菇切片。</li>
<li>不粘锅烧热，下牛肉快速煎炒，变色后先盛出。<strong>菲力易粘时薄喷一层油；吊龙、匙柄、匙仁可先利用肉本身的油脂。</strong></li>
<li>原锅炒蘑菇，收干水分；加蒜末短炒，牛肉回锅炒至熟透。按口味补黑胡椒和少量生抽，盖在米饭上。</li>
</ol></section></div></article>
