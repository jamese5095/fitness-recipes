<article><header class="recipe-heading"><h1>日式味噌鲭鱼豆腐煮</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>鲭鱼 <strong>120 g</strong>（去骨，可食生重）、木棉豆腐 <strong>150 g</strong></li>
<li>白萝卜 <strong>120 g</strong>、水 <strong>180 mL</strong></li>
<li>味噌 <strong>12 g</strong>、姜片 <strong>3 片</strong>、葱段少许</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>白萝卜切薄片，鲭鱼切块；味噌用少量温水调开。</li>
<li>锅中放萝卜、水和姜片，煮至萝卜半透明。</li>
<li>加入豆腐、鲭鱼和味噌汁，小火加盖煮至鱼熟；撒葱段。无需另加油。</li>
</ol></section></div></article>
