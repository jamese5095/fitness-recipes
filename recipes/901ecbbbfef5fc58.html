<article><header class="recipe-heading"><h1>日式海鲜豆腐寿喜锅</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>虾仁 <strong>100 g</strong>、鳕鱼 <strong>100 g</strong>、木棉豆腐 <strong>150 g</strong></li>
<li>白菜 <strong>150 g</strong>、香菇 <strong>80 g</strong>、魔芋丝 <strong>80 g</strong></li>
<li>日式酱油 <strong>12 mL</strong>、味醂 <strong>8 mL</strong>、清水 <strong>250 mL</strong></li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>确认酱油、味醂及高汤无肉类提取物；白菜切段，豆腐切块。</li>
<li>锅中加入清水、酱油和味醂煮开，放白菜、香菇、魔芋丝和豆腐煮软。</li>
<li>加入鱼块和虾仁，煮至海鲜熟透；汤汁咸度按个人口味调整。</li>
</ol></section></div></article>
