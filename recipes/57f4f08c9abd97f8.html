<article><header class="recipe-heading"><h1>韩式牛腱萝卜汤</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>牛腱肉 <strong>200 g</strong>（可食生重）、白萝卜约 <strong>250 g</strong></li>
<li>水约 <strong>500 mL</strong>、葱段、蒜末；少量生抽或盐</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>牛腱切块，焯去浮沫后加水和葱段，小火煮至接近软烂；普通锅约需 <strong>60–90 分钟</strong>，以肉质为准。</li>
<li>加白萝卜块煮软，再加蒜末煮几分钟。</li>
<li>用少量生抽或盐调味，撒葱花，配米饭食用。</li>
</ol>
<p><strong>用油与调味：</strong>全程不额外加油。这是清汤做法，不加韩式辣椒酱。</p></section></div></article>
