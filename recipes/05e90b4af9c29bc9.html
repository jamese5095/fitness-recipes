<article><header class="recipe-heading"><h1>日式亲子风豆腐滑蛋饭</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>木棉豆腐 <strong>180 g</strong>、鸡蛋 <strong>2 个</strong></li>
<li>洋葱 <strong>60 g</strong>、熟米饭 <strong>160 g</strong></li>
<li>日式酱油 <strong>8 mL</strong>、味醂 <strong>5 mL</strong>、清水 <strong>60 mL</strong>、葱花</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>豆腐切小块，洋葱切丝；鸡蛋轻轻打散。</li>
<li>小锅加入洋葱、酱油、味醂和清水，煮至洋葱变软，加入豆腐加热。</li>
<li>倒入蛋液，边缘凝固后关火焖半分钟，盖在米饭上并撒葱花。</li>
</ol></section></div></article>
