<article><header class="recipe-heading"><h1>番茄炒蛋</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>全蛋 <strong>3 个</strong></li>
<li>番茄 <strong>350–400 g</strong>；一半切丁、一半切块</li>
<li>葵花籽油喷雾、盐、葱花；白胡椒可选</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>鸡蛋加少许盐打散。不粘锅加热，<strong>只在下蛋前薄喷一层油</strong>。</li>
<li>倒入蛋液，炒至刚凝固、仍软嫩时盛出。</li>
<li>原锅下番茄，<strong>不再喷油</strong>。加少许盐，中火炒软；若粘锅，只加一小勺水。继续炒至番茄汁略收浓。</li>
<li>鸡蛋回锅，轻轻翻匀、热透；按口味加白胡椒，撒葱花出锅。</li>
</ol>
<p><strong>关键：</strong>蛋先盛出，番茄汁收浓后再回锅，避免鸡蛋久煮变老或成品过湿。全程喷油仅限下鸡蛋前一次。</p></section></div></article>
