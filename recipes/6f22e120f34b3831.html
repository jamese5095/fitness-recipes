<article><header class="recipe-heading"><h1>番茄虾仁意大利面</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>意大利面 <strong>75 g</strong>（干重）、虾仁 <strong>150 g</strong></li>
<li>番茄 <strong>200 g</strong>、菠菜 <strong>60 g</strong>、蒜末 <strong>5 g</strong></li>
<li>番茄膏 <strong>10 g</strong>、黑胡椒、盐；橄榄油 <strong>2 mL</strong></li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>意面按包装说明煮熟，留少量面水；虾仁擦干，番茄切丁。</li>
<li>锅中用少量油炒香蒜末，加入番茄和番茄膏煮成酱，太稠时加面水。</li>
<li>加虾仁煮至熟透，加入意面和菠菜拌匀，以黑胡椒、少量盐调味。</li>
</ol></section></div></article>
