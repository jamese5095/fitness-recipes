<article><header class="recipe-heading"><h1>日式鸡胸亲子丼</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>鸡胸肉 <strong>200 g</strong>（可食生重，极瘦档）、全蛋 <strong>3 个</strong>、洋葱约 <strong>100 g</strong></li>
<li>生米 <strong>80 g</strong>、葱花或海苔少许</li>
<li>浓缩寿喜锅汁、适量水（甜咸与出汁风味；浓淡按所用产品和口味调整）</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>米饭煮好。鸡胸切薄片，洋葱切丝，鸡蛋轻轻打散。</li>
<li>不粘锅加入寿喜汁和适量水，放入洋葱和鸡胸，中火煮至鸡肉熟透；汤汁太少时补水。</li>
<li>倒入蛋液，盖锅煮至蛋液凝固，盛在米饭上，撒葱花或海苔。</li>
</ol>
<p><strong>用油：</strong>这道菜靠汤汁煮，不用喷油。寿喜汁已提供甜咸味，不再另加生抽、糖或味醂。</p></section></div></article>
