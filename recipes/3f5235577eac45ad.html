<article><header class="recipe-heading"><h1>地中海香草白鱼烩菜</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>白身鱼柳 <strong>180 g</strong>、彩椒 <strong>100 g</strong>、番茄 <strong>180 g</strong></li>
<li>洋葱 <strong>40 g</strong>、黑橄榄 <strong>10 g</strong>（可选）</li>
<li>柠檬汁、干牛至、黑胡椒、盐；水 <strong>80 mL</strong></li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>鱼柳切块，彩椒、洋葱和番茄切成适口大小。</li>
<li>锅中放洋葱、彩椒和水，煮 3 分钟后加入番茄及牛至。</li>
<li>放入鱼块，小火焖至熟透；用柠檬汁、黑胡椒和少量盐调味，最后拌入橄榄。</li>
</ol></section></div></article>
