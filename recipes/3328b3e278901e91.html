<article><header class="recipe-heading"><h1>西班牙土豆烘蛋</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>鸡蛋 <strong>2 个</strong>、蛋清 <strong>100 g</strong></li>
<li>土豆 <strong>180 g</strong>、洋葱 <strong>40 g</strong>、菠菜 <strong>50 g</strong></li>
<li>黑胡椒、盐；橄榄油 <strong>2 mL</strong></li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>土豆切薄片，微波或蒸至七分熟；洋葱切丝。</li>
<li>不粘锅加入少量油，炒軟洋葱和菠菜，加入土豆铺匀。</li>
<li>鸡蛋与蛋清打散调味后倒入锅中，小火加盖至凝固；也可转入 180℃烤箱烤熟。</li>
</ol></section></div></article>
