<article><header class="recipe-heading"><h1>蒜香黑椒煎虾仁</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>虾仁 <strong>200 g</strong></li>
<li>西兰花 <strong>200 g</strong>、蒜末 <strong>8 g</strong></li>
<li>黑胡椒、盐、柠檬汁；食用油喷雾</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>虾仁擦干，西兰花掰小朵后焯水 2 分钟。</li>
<li>不粘锅喷薄油，放蒜末炒出香味，加入虾仁摊开煎至两面变色熟透。</li>
<li>加入西兰花翻匀，以黑胡椒、少量盐和柠檬汁调味。</li>
</ol></section></div></article>
