<article><header class="recipe-heading"><h1>冬阴功海鲜汤</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>虾仁 <strong>100 g</strong>、鱿鱼 <strong>80 g</strong>、白鱼片 <strong>80 g</strong></li>
<li>蘑菇 <strong>100 g</strong>、番茄 <strong>100 g</strong>、水 <strong>350 mL</strong></li>
<li>冬阴功酱 <strong>10 g</strong>（核对配料）、青柠汁、香茅可选</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>先检查冬阴功酱不含肉类提取物；蘑菇切片，番茄切块。</li>
<li>水煮开后加入香茅、蘑菇、番茄和冬阴功酱，煮 5 分钟。</li>
<li>依次加入白鱼、鱿鱼和虾仁，煮至熟透，关火后加青柠汁调味。</li>
</ol></section></div></article>
