<article><header class="recipe-heading"><h1>泰式罗勒虾仁饭</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>虾仁 <strong>180 g</strong>、熟米饭 <strong>160 g</strong></li>
<li>罗勒叶 <strong>15 g</strong>、彩椒 <strong>100 g</strong>、蒜末 <strong>5 g</strong></li>
<li>鱼露 <strong>5 mL</strong>、低钠生抽 <strong>5 mL</strong>、青柠汁；油喷雾</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>虾仁擦干，彩椒切条；鱼露、生抽和一勺水混合。</li>
<li>不粘锅喷薄油，炒香蒜末后加入彩椒和虾仁，炒至虾熟。</li>
<li>加入调味汁和罗勒快速翻匀，挤青柠汁，配熟米饭。</li>
</ol></section></div></article>
