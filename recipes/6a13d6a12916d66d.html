<article><header class="recipe-heading"><h1>香草蒜蓉烤大虾</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>去壳大虾 <strong>200 g</strong>（留尾可选）</li>
<li>彩椒 <strong>120 g</strong>、蒜末 <strong>6 g</strong></li>
<li>柠檬汁、欧芹、黑胡椒、盐；食用油喷雾</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>烤箱预热至 210℃，大虾开背去虾线，彩椒切块。</li>
<li>大虾与彩椒拌入蒜末、黑胡椒、少量盐和薄薄一层油。</li>
<li>铺在烤盘上烤 7–9 分钟至虾熟透，挤柠檬汁并撒欧芹。</li>
</ol></section></div></article>
