<article><header class="recipe-heading"><h1>地中海番茄烤鲈鱼</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>鲈鱼鱼柳 <strong>180 g</strong>、小番茄 <strong>180 g</strong></li>
<li>西葫芦 <strong>120 g</strong>、洋葱 <strong>40 g</strong></li>
<li>柠檬片、欧芹、黑胡椒、盐；橄榄油 <strong>2 mL</strong></li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>烤箱预热至 200℃；鱼柳擦干，蔬菜切片并放入烤盘。</li>
<li>蔬菜拌入橄榄油、黑胡椒和少量盐，鱼柳放在上面，铺柠檬片。</li>
<li>烤 12–16 分钟，确认鱼肉中心熟透；撒欧芹后上桌。</li>
</ol></section></div></article>
