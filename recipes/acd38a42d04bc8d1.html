<article><header class="recipe-heading"><h1>金枪鱼蘑菇奶油意面</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>全麦意面 <strong>75 g</strong>（干重）、水浸金枪鱼 <strong>100 g</strong>（沥干）</li>
<li>口蘑 <strong>150 g</strong>、无糖豆浆 <strong>100 mL</strong>、洋葱 <strong>30 g</strong></li>
<li>玉米淀粉 <strong>3 g</strong>、黑胡椒；盐少许</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>意面按包装说明煮熟；蘑菇切片，洋葱切丁，金枪鱼沥干。</li>
<li>不粘锅加入洋葱和蘑菇，加一勺水炒软；倒入豆浆和淀粉水，小火搅至略浓。</li>
<li>拌入意面和金枪鱼，加黑胡椒调味；避免久煮使金枪鱼变干。</li>
</ol></section></div></article>
