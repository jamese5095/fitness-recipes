<article><header class="recipe-heading"><h1>味噌烤三文鱼</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>三文鱼 <strong>140 g</strong>（去皮，可食生重）</li>
<li>白味噌 <strong>10 g</strong>、味醂 <strong>5 mL</strong>、清水 <strong>10 mL</strong></li>
<li>西兰花 <strong>180 g</strong>、柠檬角</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>味噌、味醂和清水调匀，薄薄抹在三文鱼表面，腌 10 分钟。</li>
<li>烤箱预热至 200℃；三文鱼放烤盘，烤约 10–14 分钟至中心熟透。</li>
<li>西兰花蒸熟或焯熟，与三文鱼同盘，挤少量柠檬汁食用。</li>
</ol></section></div></article>
