<article><header class="recipe-heading"><h1>麻婆豆腐（无肉版）</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>北豆腐 <strong>250 g</strong>、香菇 <strong>80 g</strong>（切细丁）</li>
<li>豆瓣酱 <strong>8 g</strong>、生抽 <strong>5 mL</strong>、蒜末和姜末</li>
<li>水 <strong>120 mL</strong>、玉米淀粉 <strong>3 g</strong>、花椒粉；油喷雾</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>检查豆瓣酱配料不含肉类；豆腐切块，香菇切细丁。</li>
<li>不粘锅喷薄油，炒香姜蒜和香菇，加入豆瓣酱炒出红色后加水、生抽煮开。</li>
<li>放入豆腐轻推煮 4 分钟，淋入淀粉水收汁，撒花椒粉。</li>
</ol></section></div></article>
