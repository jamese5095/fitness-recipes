<article><header class="recipe-heading"><h1>韩式泡菜豆腐海鲜锅</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>虾仁 <strong>100 g</strong>、鱿鱼 <strong>80 g</strong>、嫩豆腐 <strong>200 g</strong></li>
<li>泡菜 <strong>80 g</strong>、金针菇 <strong>80 g</strong>、水或蔬菜高汤 <strong>350 mL</strong></li>
<li>韩式辣椒粉 <strong>3 g</strong>、蒜末；泡菜汁少许</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>确认泡菜及高汤不含肉类提取物；泡菜切段，豆腐切块。</li>
<li>锅中放泡菜、蒜末和 2 勺水炒香，加入水或蔬菜高汤煮开。</li>
<li>加入豆腐、金针菇煮 4 分钟，再放虾仁和鱿鱼煮熟；按泡菜咸度调整辣椒粉和盐。</li>
</ol></section></div></article>
