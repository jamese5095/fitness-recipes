<article><header class="recipe-heading"><h1>番茄鳕鱼豆腐烩菜</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>鳕鱼或明太鱼柳 <strong>150 g</strong>（可食生重）</li>
<li>嫩豆腐 <strong>150 g</strong>、番茄 <strong>250 g</strong>、菠菜 <strong>100 g</strong></li>
<li>蒜末、盐、白胡椒；水 <strong>100 mL</strong></li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>番茄切块，豆腐切大块，鱼柳擦干后切块。</li>
<li>锅中放番茄、蒜末和水，煮至番茄出汁；加入豆腐煮 3 分钟。</li>
<li>放入鱼块，小火加盖煮至鱼肉熟透，最后加入菠菜烫熟，以盐和白胡椒调味。</li>
</ol></section></div></article>
