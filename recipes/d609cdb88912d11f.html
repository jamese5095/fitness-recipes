<article><header class="recipe-heading"><h1>番茄菌菇鱼片汤</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>白身鱼片 <strong>180 g</strong>、番茄 <strong>200 g</strong></li>
<li>香菇 <strong>80 g</strong>、嫩豆腐 <strong>100 g</strong>、青菜 <strong>80 g</strong></li>
<li>姜片、白胡椒、盐；水 <strong>400 mL</strong></li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>鱼片用厨房纸吸干，番茄切块，香菇切片。</li>
<li>锅中加入番茄、姜片和水煮开，放入香菇和豆腐煮 5 分钟。</li>
<li>转小火下鱼片，煮至中心熟透，加入青菜烫熟，以白胡椒和少量盐调味。</li>
</ol></section></div></article>
