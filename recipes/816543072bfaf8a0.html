<article><header class="recipe-heading"><h1>蒜香鸡胸土豆蘑菇锅</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>鸡胸肉 <strong>200 g</strong>（去皮、去骨可食生重）</li>
<li>土豆 <strong>300 g</strong>（可食重量）、蘑菇约 <strong>150 g</strong></li>
<li>蒜末、盐、黑胡椒；少量生抽可选；食用油喷雾</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>土豆切小块，煮或微波至接近熟透，沥干。鸡胸切块，加少许盐、黑胡椒抓匀。</li>
<li>不粘锅薄喷一层油，下鸡胸煎炒至熟透，先盛出。</li>
<li>原锅下蘑菇，炒干析出的水；加入土豆，煎至表面略上色。粘锅时加一小勺水，不必反复喷油。</li>
<li>加蒜末短炒出香，鸡胸回锅；按需加少量生抽，翻匀出锅。</li>
</ol></section></div></article>
