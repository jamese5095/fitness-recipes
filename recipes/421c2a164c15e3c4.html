<article><header class="recipe-heading"><h1>番茄鳕鱼烩菜</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>去骨鳕鱼或明太鱼鱼柳 <strong>200 g</strong>（可食生重）</li>
<li>番茄 <strong>250–300 g</strong>、绿叶菜或其他易熟蔬菜约 <strong>150 g</strong></li>
<li>蒜末、盐、白胡椒；少量水</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>鱼柳切大块，擦干；番茄一半切丁、一半切块。</li>
<li>不粘锅下番茄丁、蒜末和一小勺水，中火煮软成汁；加入番茄块，煮至略浓。<strong>不用额外加油。</strong></li>
<li>放入鱼块，盖锅用中小火焖至鱼肉熟透；再加入蔬菜煮熟。用盐、白胡椒调味，轻翻后出锅，避免把鱼块搅碎。</li>
</ol></section></div></article>
