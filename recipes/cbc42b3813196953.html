<article><header class="recipe-heading"><h1>虾仁滑蛋</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>虾仁 <strong>150 g</strong>、鸡蛋 <strong>2 个</strong>、蛋清 <strong>50 g</strong></li>
<li>牛奶或无糖豆浆 <strong>15 mL</strong>、葱花少许</li>
<li>白胡椒、盐；食用油喷雾</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>虾仁擦干，鸡蛋、蛋清与牛奶或豆浆打匀，加入少量盐和白胡椒。</li>
<li>不粘锅喷薄油，将虾仁煎至八成熟后倒入蛋液。</li>
<li>用锅铲缓慢推炒，蛋液尚微湿时关火，利用余温凝固并撒葱花。</li>
</ol></section></div></article>
