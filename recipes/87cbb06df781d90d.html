<article><header class="recipe-heading"><h1>香煎鳕鱼佐柠檬黄油汁</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>鳕鱼柳 <strong>180 g</strong>、芦笋 <strong>150 g</strong></li>
<li>柠檬汁 <strong>10 mL</strong>、黄油 <strong>3 g</strong>（可省略）</li>
<li>黑胡椒、盐、蒜末；食用油喷雾</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>鳕鱼擦干，两面撒少量盐和黑胡椒；芦笋切去老根。</li>
<li>不粘锅喷薄油，中火将鳕鱼每面煎约 3–4 分钟至熟；旁边煎熟芦笋。</li>
<li>转小火，锅中加入柠檬汁、蒜末和黄油，搅匀后淋在鱼上。</li>
</ol></section></div></article>
