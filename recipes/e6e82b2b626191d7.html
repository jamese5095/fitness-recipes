<article><header class="recipe-heading"><h1>奶香蘑菇三文鱼炖菜</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>三文鱼 <strong>120 g</strong>（去皮，可食生重）、口蘑 <strong>150 g</strong></li>
<li>北豆腐 <strong>100 g</strong>、无糖豆浆 <strong>120 mL</strong>、洋葱 <strong>50 g</strong></li>
<li>黑胡椒、盐、百里香；食用油喷雾</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>三文鱼切块，蘑菇切片，洋葱切丁。</li>
<li>锅中喷少量油，先炒软洋葱和蘑菇，加入豆浆及 80 mL 水，小火煮 4 分钟。</li>
<li>放入豆腐和三文鱼，轻轻煮至鱼肉熟透，以盐、黑胡椒和百里香调味。</li>
</ol></section></div></article>
