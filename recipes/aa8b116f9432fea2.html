<article><header class="recipe-heading"><h1>白菜豆腐虾滑锅</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>纯虾滑 <strong>150 g</strong>（查看配料，或用虾仁剁泥自制）</li>
<li>嫩豆腐 <strong>150 g</strong>、白菜 <strong>200 g</strong>、香菇 <strong>60 g</strong></li>
<li>水或蔬菜高汤 <strong>350 mL</strong>、白胡椒、盐、葱花</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>若用包装虾滑，确认配料不含猪肉、鸡肉或肉汤；白菜切块，豆腐切块。</li>
<li>锅中加入白菜、香菇和水煮至变软，调入少量盐和白胡椒。</li>
<li>用勺子将虾滑分成小团下锅，煮至完全熟透，加入豆腐再煮 2 分钟，撒葱花。</li>
</ol></section></div></article>
