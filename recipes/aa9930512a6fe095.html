<article><header class="recipe-heading"><h1>韩式海鲜石锅拌饭</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>熟米饭 <strong>160 g</strong>、虾仁 <strong>100 g</strong>、鱿鱼 <strong>80 g</strong></li>
<li>菠菜、胡萝卜、豆芽合计 <strong>180 g</strong>、鸡蛋 <strong>1 个</strong></li>
<li>韩式辣椒酱 <strong>10 g</strong>（核对配料）、米醋少许；油喷雾</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>蔬菜分别焯熟或用不粘锅加少量水炒熟；海鲜擦干。</li>
<li>海鲜煎炒至熟透，鸡蛋煎熟；石锅或厚底锅薄薄喷油后铺入米饭，小火加热至底部微脆。</li>
<li>放上蔬菜、海鲜和鸡蛋，配少量辣椒酱及米醋拌食。</li>
</ol></section></div></article>
