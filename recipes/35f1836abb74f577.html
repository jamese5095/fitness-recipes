<article><header class="recipe-heading"><h1>菠菜蘑菇芝士烘蛋</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>鸡蛋 <strong>2 个</strong>、蛋清 <strong>100 g</strong></li>
<li>菠菜 <strong>80 g</strong>、口蘑 <strong>100 g</strong>、低脂芝士 <strong>15 g</strong></li>
<li>黑胡椒、盐；食用油喷雾</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>烤箱预热至 180℃；蘑菇切片，菠菜洗净沥干。</li>
<li>不粘锅喷薄油，炒软蘑菇和菠菜；鸡蛋与蛋清打匀，加入黑胡椒。</li>
<li>倒入耐热烤碗，撒芝士，烤 12–16 分钟至中心凝固。</li>
</ol></section></div></article>
