<article><header class="recipe-heading"><h1>地中海海鲜烩饭</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>生米 <strong>75 g</strong>、虾仁 <strong>80 g</strong>、青口贝肉 <strong>80 g</strong></li>
<li>番茄 <strong>120 g</strong>、彩椒 <strong>80 g</strong>、洋葱 <strong>40 g</strong></li>
<li>无肉蔬菜高汤或水 <strong>300 mL</strong>、藏红花或红椒粉少许</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>确认高汤不含肉类成分；洋葱和彩椒切丁，番茄切块。</li>
<li>不粘锅加两勺水炒软蔬菜，加入生米、番茄和香料翻匀。</li>
<li>分次加入高汤，小火加盖煮至米饭将熟，再铺上虾仁和青口贝煮熟；按需补水。</li>
</ol></section></div></article>
