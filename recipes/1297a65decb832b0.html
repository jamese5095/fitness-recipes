<article><header class="recipe-heading"><h1>姜葱蒸去皮鸡腿</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>去皮、去骨鸡腿肉 <strong>200 g</strong>（可食生重）</li>
<li>姜丝、葱段、少量生抽、白胡椒；绿叶菜约 <strong>200 g</strong></li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>鸡腿肉去皮，厚处划开或切成均匀小块，加入姜丝、少量生抽和白胡椒，抓匀腌约 10 分钟。</li>
<li>铺上葱段，水开后上锅蒸约 <strong>12–18 分钟</strong>；时间随肉块厚度调整，确保中心熟透。</li>
<li>绿叶菜另焯熟，或在鸡腿快熟时放入蒸锅。用少量蒸出的肉汁拌菜，按口味补盐。</li>
</ol>
<p><strong>用油：</strong>全程不用额外加油；不加重油酱汁。</p></section></div></article>
