<article><header class="recipe-heading"><h1>番茄虾仁鹰嘴豆炖菜</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>虾仁 <strong>150 g</strong>、熟鹰嘴豆 <strong>100 g</strong>（沥干）</li>
<li>番茄 <strong>200 g</strong>、西葫芦 <strong>150 g</strong>、洋葱 <strong>40 g</strong></li>
<li>蒜末、烟熏红椒粉、盐；水 <strong>100 mL</strong></li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>西葫芦切半月片，番茄切块，虾仁擦干。</li>
<li>锅中加入洋葱、蒜末和一勺水炒软，放番茄、西葫芦及鹰嘴豆煮 6 分钟。</li>
<li>加入虾仁煮至变色熟透，以红椒粉和少量盐调味。</li>
</ol></section></div></article>
