<article><header class="recipe-heading"><h1>味噌三文鱼蔬菜汤</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>三文鱼 <strong>120 g</strong>、木棉豆腐 <strong>100 g</strong></li>
<li>白菜 <strong>120 g</strong>、胡萝卜 <strong>50 g</strong>、水 <strong>350 mL</strong></li>
<li>味噌 <strong>12 g</strong>、姜片少许、葱花</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>三文鱼去皮切块，白菜切段，胡萝卜切薄片。</li>
<li>锅中加水、姜片和胡萝卜煮软，加入白菜和豆腐煮 3 分钟。</li>
<li>放入三文鱼煮熟，转小火化开味噌（不要大滚），撒葱花。</li>
</ol></section></div></article>
