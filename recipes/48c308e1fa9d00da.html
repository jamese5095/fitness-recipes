<article><header class="recipe-heading"><h1>日式鳗鱼鸡蛋盖饭</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>熟鳗鱼 <strong>100 g</strong>（查看酱汁配料）</li>
<li>鸡蛋 <strong>2 个</strong>、熟米饭 <strong>160 g</strong>、菠菜 <strong>80 g</strong></li>
<li>日式酱油 <strong>5 mL</strong>、清水 <strong>20 mL</strong>、海苔丝少许</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>菠菜焯熟挤去多余水分，鳗鱼切段并按包装说明加热。</li>
<li>鸡蛋打散；小锅中加入酱油和清水煮开，倒入蛋液，半凝固时关火。</li>
<li>米饭盛碗，铺上滑蛋、鳗鱼和菠菜，撒海苔丝。</li>
</ol></section></div></article>
