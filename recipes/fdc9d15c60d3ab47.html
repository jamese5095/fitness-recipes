<article><header class="recipe-heading"><h1>虾仁三文鱼海鲜炒饭</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>熟米饭 <strong>180 g</strong>（优先用冷藏米饭）</li>
<li>虾仁 <strong>80 g</strong>、三文鱼 <strong>70 g</strong>、鸡蛋 <strong>1 个</strong></li>
<li>豌豆胡萝卜 <strong>80 g</strong>、生抽 <strong>8 mL</strong>、葱花；油喷雾</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>三文鱼切小块，虾仁擦干，蔬菜解冻；米饭提前拨散。</li>
<li>不粘锅喷薄油，先炒蛋至凝固盛出，再将三文鱼和虾仁炒至熟透。</li>
<li>加入蔬菜和米饭炒散，回锅鸡蛋，以生抽调味并撒葱花。</li>
</ol></section></div></article>
