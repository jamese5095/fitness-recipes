<article><header class="recipe-heading"><h1>日式照烧豆腐排</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>木棉豆腐 <strong>250 g</strong></li>
<li>生抽 <strong>10 mL</strong>、味醂 <strong>8 mL</strong>、清水 <strong>20 mL</strong></li>
<li>玉米淀粉 <strong>4 g</strong>、姜末少许；食用油喷雾</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>豆腐用厨房纸吸去表面水分，切成两块厚片，薄薄拍上淀粉。</li>
<li>不粘锅喷薄油，中火将豆腐两面煎至金黄。</li>
<li>加入生抽、味醂、清水和姜末，小火翻面收汁至挂薄芡。</li>
</ol></section></div></article>
