<article><header class="recipe-heading"><h1>韩式蛤蜊嫩豆腐汤</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>蛤蜊肉 <strong>120 g</strong>、嫩豆腐 <strong>200 g</strong></li>
<li>西葫芦 <strong>100 g</strong>、金针菇 <strong>60 g</strong>、水 <strong>300 mL</strong></li>
<li>韩式辣椒粉 <strong>3 g</strong>、蒜末、葱花；盐少许</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>蛤蜊肉洗净；若用带壳蛤蜊，先吐沙并煮至开口，弃掉不开口的。</li>
<li>锅中加入水、蒜末、西葫芦和金针菇，煮 4 分钟。</li>
<li>加入豆腐和蛤蜊，煮至热透，以辣椒粉和少量盐调味，撒葱花。</li>
</ol></section></div></article>
