<article><header class="recipe-heading"><h1>日式蟹肉蒸蛋</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>鸡蛋 <strong>2 个</strong>、温水或昆布水 <strong>220 mL</strong></li>
<li>熟蟹肉 <strong>60 g</strong>（不用含肉类添加物的蟹柳）、香菇 <strong>30 g</strong></li>
<li>日式酱油 <strong>4 mL</strong>、盐少许、葱花</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>鸡蛋打散，与温水、酱油和少量盐混匀并过滤；蟹肉检查碎壳。</li>
<li>蛋液倒入耐热碗，放入蟹肉和香菇，盖上盘子或耐热膜。</li>
<li>水沸后转小火蒸 10–12 分钟，至中心凝固；撒葱花。</li>
</ol></section></div></article>
