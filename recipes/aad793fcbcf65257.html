<article><header class="recipe-heading"><h1>香煎豆腐佐蘑菇酱</h1></header><div class="recipe-body"><section class="recipe-section"><h2>食材（1 份）</h2><ul>
<li>木棉豆腐 <strong>250 g</strong>、口蘑 <strong>150 g</strong></li>
<li>低钠生抽 <strong>8 mL</strong>、玉米淀粉 <strong>3 g</strong>、水 <strong>80 mL</strong></li>
<li>黑胡椒、蒜末；食用油喷雾</li>
</ul></section><section class="recipe-section"><h2>做法</h2><ol>
<li>豆腐吸干表面水分后切厚片，蘑菇切片。</li>
<li>不粘锅喷薄油，将豆腐两面煎至金黄后盛出；同锅炒香蒜末和蘑菇。</li>
<li>加入生抽、水和淀粉水煮至酱汁略稠，淋在豆腐上并撒黑胡椒。</li>
</ol></section></div></article>
